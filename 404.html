<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1CC Wiki</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/icon.svg">
  <script>
    (async function() {
      const path = window.location.pathname;
      const cleanSlug = decodeURIComponent(path.split('/').pop().replace(/\.html$/, '')).trim().toLowerCase();

      if (!cleanSlug || cleanSlug === 'index') {
        window.location.replace('./');
        return;
      }

      // Base path calculation for root domain vs GitHub Pages subfolder
      const isCustomDomain = window.location.hostname === 'f1cc.wiki' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const basePath = isCustomDomain ? '/' : (window.location.pathname.startsWith('/f1cc-wiki') ? '/f1cc-wiki/' : '/');
      function toUrl(dest) {
        return basePath + dest.replace(/^\//, '');
      }

      // 1. Check known core pages
      const corePages = {
        'seasons': 'pages/seasons.html',
        'season': 'pages/season.html',
        'drivers': 'pages/drivers.html',
        'driver': 'pages/driver.html',
        'teams': 'pages/teams.html',
        'team': 'pages/team.html',
        'records': 'pages/records.html',
        'elo': 'pages/elo.html',
        'radio': 'pages/radio.html',
        'market': 'pages/market.html',
        'race': 'pages/race.html',
        'absolute-data': 'pages/absolute-data.html',
        'absolute_data': 'pages/absolute-data.html',
        'absolute': 'pages/absolute-data.html',
        'hub': 'pages/hub.html',
        'lineup': 'pages/lineup.html',
        'line-up': 'pages/lineup.html',
        'line_up': 'pages/lineup.html',
        'f1_lineup': 'pages/lineup.html?series=f1',
        'f2_lineup': 'pages/lineup.html?series=f2'
      };

      if (corePages[cleanSlug]) {
        window.location.replace(toUrl(corePages[cleanSlug]) + window.location.search + window.location.hash);
        return;
      }

      // 2. Check series shortcuts (f1_teams / f2_teams)
      if (cleanSlug === 'f1_teams' || cleanSlug === 'f1-teams' || cleanSlug === 'f1teams') {
        window.location.replace(toUrl('pages/teams.html?series=f1') + window.location.hash);
        return;
      }
      if (cleanSlug === 'f2_teams' || cleanSlug === 'f2-teams' || cleanSlug === 'f2teams') {
        window.location.replace(toUrl('pages/teams.html?series=f2') + window.location.hash);
        return;
      }

      // 3. Check hub shortcut routes (e.g. hub-ferrari, hub_ferrari)
      if (cleanSlug.startsWith('hub-') || cleanSlug.startsWith('hub_')) {
        const teamKey = cleanSlug.slice(4);
        window.location.replace(toUrl('pages/hub.html?team=' + encodeURIComponent(teamKey)) + window.location.hash);
        return;
      }

      // 4. Check season year vanity URLs (e.g., 2027, 2026, 2025, 2026_f2, 2026-f2)
      if (/^\d{4}(?:_f2|-f2)?$/i.test(cleanSlug)) {
        const yr = cleanSlug.replace('-', '_');
        window.location.replace(toUrl('pages/season.html?year=' + encodeURIComponent(yr)) + window.location.hash);
        return;
      }

      // 5. Check database for teams and drivers
      try {
        const resp = await fetch(toUrl('data/db.json'));
        if (resp.ok) {
          const db = await resp.json();

          // A) Team vanity URLs (e.g. /vcarb, /ferrari, /red_bull, /mclaren)
          const teams = db.teams || {};
          const teamAliases = {
            'redbull': 'red_bull',
            'red-bull': 'red_bull',
            'astonmartin': 'aston_martin',
            'aston-martin': 'aston_martin',
            'racingbulls': 'vcarb',
            'racing_bulls': 'vcarb',
            'racing-bulls': 'vcarb',
            'rb': 'vcarb',
            'sauber': 'kick_sauber',
            'kicksauber': 'kick_sauber',
            'kick-sauber': 'kick_sauber',
            'mp': 'mp_motorsport',
            'mpmotorsport': 'mp_motorsport',
            'aixt': 'aix',
            'van_amersfoort': 'var',
            'vanamersfoort': 'var'
          };

          const matchedTeamId = teams[cleanSlug] ? cleanSlug : (teamAliases[cleanSlug] || null);
          if (matchedTeamId) {
            window.location.replace(toUrl('pages/team.html?id=' + encodeURIComponent(matchedTeamId)) + (window.location.hash || ''));
            return;
          }

          // B) Driver vanity URLs
          const drivers = db.drivers || {};
          const match = Object.entries(drivers).find(([id, d]) => {
            const dSlug = (d.name || '').trim().replace(/\s+/g, '_').toLowerCase();
            const idLower = id.toLowerCase();
            return dSlug === cleanSlug || idLower === cleanSlug;
          });

          if (match) {
            window.location.replace(toUrl('pages/driver.html?id=' + encodeURIComponent(match[0])) + (window.location.hash || ''));
            return;
          }
        }
      } catch (e) {
        console.error(e);
      }

      // 6. If not resolved, show the 404 message
      document.addEventListener('DOMContentLoaded', () => {
        const el = document.getElementById('not-found-msg');
        if (el) el.style.display = 'block';
      });
    })();
  </script>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem;">
  <div id="not-found-msg" style="display:none;max-width:480px;">
    <h1 style="font-size:4rem;font-weight:800;color:var(--red, #e10600);margin-bottom:0.5rem;">404</h1>
    <h2 style="font-size:1.5rem;margin-bottom:1rem;">Page Not Found</h2>
    <p style="color:var(--text-muted, #888);margin-bottom:2rem;">The page you are looking for does not exist or has been moved.</p>
    <a href="./" class="btn btn-ghost" style="padding:10px 24px;text-decoration:none;">← Back to Home</a>
  </div>
</body>
</html>
