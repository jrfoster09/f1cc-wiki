<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#35383d">
  <title>Driver — F1CC Wiki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../assets/icon.svg">
  <script src="https://unpkg.com/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous" async></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<a href="#main-content" class="skip-link">Skip to content</a>

<div class="sticky-header">
  <div class="topbar">
    <a href="../index.html" class="brand-link"><img src="../assets/photos/wikilogo.png" alt="F1CC Wiki" class="brand-logo"></a>
    <div class="tagline">Community Career &middot; Official Database</div>
    <button class="nav-hamburger" id="nav-hamburger" aria-label="Open navigation menu" aria-expanded="false" aria-controls="nav-links">
      <span></span><span></span><span></span>
    </button>
  </div>
  <nav class="nav-row" id="nav-links" aria-label="Site navigation">
    <a class="nav-link" href="../index.html">Home</a>
    <a class="nav-link" href="seasons.html">Seasons</a>
    <a class="nav-link active" href="drivers.html">Drivers</a>
    <a class="nav-link" href="teams.html">Teams</a>
    <a class="nav-link" href="records.html">Records</a>
    <a class="nav-link" href="elo.html">ELO</a>
    <a class="nav-link" href="radio.html">Radio Card</a>
    <a class="nav-link news-link" href="https://thated.github.io/F1CC-News-Site/index.html" target="_blank" rel="noopener">News ↗</a>
  </nav>
</div>

<div class="hero-strip" id="driver-hero">
  <div class="hero-eyebrow" id="hero-eye">Driver Profile</div>
  <h1 class="hero-title" id="hero-title">Loading…</h1>
  <p class="hero-sub" id="hero-sub"></p>
</div>

<main class="page-container" id="main-content">
  <a class="back-link" href="drivers.html">← All Drivers</a>
  <div id="content"><div style="color:var(--text-muted)">Loading driver profile…</div></div>
</main>

<footer>
  <p>F1CC Wiki · <a href="../index.html">Home</a></p>
</footer>

<script src="../js/core.js"></script>
<script>
async function init() {
  const [dbData, eloData] = await Promise.all([
    fetch('../data/db.json' ).then(r => r.json()),
    fetch('../data/elo.json').then(r => r.json()).catch(() => null),
  ]);
  DB = dbData;
  const params = new URLSearchParams(window.location.search);
  const driverId = params.get('id');

  const driver = DB.drivers[driverId];
  if (!driver) {
    document.getElementById('content').innerHTML = '<p style="color:var(--text-muted)">Driver not found.</p>';
    return;
  }

  document.title = `${driver.name} — F1CC Wiki`;
  document.getElementById('hero-eye').textContent = `Driver Profile`;
  document.getElementById('hero-title').textContent = driver.name;

  // Fetch all race files (both F1 and F2) to scan exact teams & stats per season
  const allSeasonKeys = Object.keys(DB.seasons);
  const raceFileEntries = await Promise.all(
    allSeasonKeys.map(skey =>
      fetch(`../data/races_${skey}.json`)
        .then(r => r.ok ? r.json() : { races: [] })
        .catch(() => ({ races: [] }))
        .then(data => [skey, data])
    )
  );
  const raceDataBySeason = Object.fromEntries(raceFileEntries);

  // Compute live career stats (F1) and chronological team stints per season (F1 + F2)
  let careerWins = 0, careerPodiums = 0, careerPoints = 0, careerRaces = 0,
      careerPoles = 0, careerFL = 0, careerBestResult = 99;
  const seasonResults = {}; // skey -> {champPos, points, wins, podiums, races, teams}
  const seasonTeamsMap = {}; // skey -> [teamId1, teamId2, ...]

  for (const [year, seasonData] of Object.entries(DB.seasons)) {
    const row = (seasonData.driver_standings || []).find(s => s.driver === driverId);
    if (row) {
      seasonResults[year] = {
        champPos: row.pos, points: row.points, wins: row.wins || 0,
        podiums: row.podiums || 0, races: row.races || 0
      };
      if (row.teams && row.teams.length) {
        seasonTeamsMap[year] = [...row.teams];
      }
    }
  }

  for (const [skey, raceData] of raceFileEntries) {
    const isF2 = skey.includes('_f2');
    let w=0, p=0, pts=0, races=0, poles=0, fl=0;
    const scannedTeams = [];
    const sortedRaces = [...(raceData.races || [])].sort((a,b) => (a.round||0) - (b.round||0));
    for (const race of sortedRaces) {
      if (race.status !== 'complete') continue;
      const myResult = race.results?.find(r => r.driver === driverId);
      if (!myResult) continue;
      races++;
      pts += myResult.points || 0;
      if (myResult.team && !scannedTeams.includes(myResult.team)) {
        scannedTeams.push(myResult.team);
      }
      if (myResult.pos === 1) w++;
      if (myResult.pos <= 3) p++;
      if (myResult.quali_pos === 1) poles++;
      if (myResult.fastest_lap) fl++;
      if (!isF2 && typeof myResult.pos === 'number' && myResult.pos < careerBestResult) {
        careerBestResult = myResult.pos;
      }
    }
    if (scannedTeams.length > 0) {
      seasonTeamsMap[skey] = scannedTeams;
    }
    if (!isF2 && races > 0) {
      careerWins += w; careerPodiums += p; careerPoints += pts;
      careerRaces += races; careerPoles += poles; careerFL += fl;
    }
  }

  // Combine driver.seasons keys with any season where driver appeared in races/standings
  const seasonKeySet = new Set([
    ...Object.keys(driver.seasons || {}),
    ...Object.keys(seasonResults),
    ...Object.keys(seasonTeamsMap),
  ]);
  const seasons = [...seasonKeySet].sort((a,b) => {
    const yearA = parseInt(a), yearB = parseInt(b);
    if (yearB !== yearA) return yearB - yearA; // newer first
    const isF2A = a.includes('_f2'), isF2B = b.includes('_f2');
    return isF2A - isF2B; // Same year: F1 before F2
  });

  const getSeasonTeams = (skey) => {
    if (seasonTeamsMap[skey] && seasonTeamsMap[skey].length) return seasonTeamsMap[skey];
    const ds = driver.seasons?.[skey];
    if (ds && typeof ds === 'object') {
      if (ds.teams && ds.teams.length) return ds.teams;
      if (ds.team) return [ds.team];
    } else if (typeof ds === 'string') {
      return [ds];
    }
    return [];
  };

  const f1Seasons = seasons.filter(k => !k.includes('_f2'));
  const cleanYears = [...new Set(seasons.map(k => k.split('_')[0]))].sort();
  const firstYear = cleanYears[0] || '';
  const lastYear = cleanYears[cleanYears.length - 1] || '';
  const activeRange = firstYear === lastYear ? firstYear : `${firstYear}–${lastYear}`;

  const teamStyle = (teamId) => {
    const t = DB.teams[teamId]; if (!t) return '';
    const h=t.color; const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
    return `background:rgba(${r},${g},${b},0.18);color:${h};border-color:rgba(${r},${g},${b},0.4)`;
  };

  // Build header series + team badges for the driver's latest active year (both F2 and F1 if applicable)
  const latestYearSeasons = seasons.filter(k => k.split('_')[0] === lastYear).sort((a,b) => {
    // Chronological order in header: F2 first if they started in F2 and moved to F1
    return (b.includes('_f2') ? 1 : 0) - (a.includes('_f2') ? 1 : 0);
  });
  const headerTeamBadges = [];
  const headerTeamNames = [];
  latestYearSeasons.forEach(skey => {
    const isF2 = skey.includes('_f2');
    const sLabel = isF2 ? 'F2' : 'F1';
    const sClass = isF2 ? 'tag-f2' : 'tag-f1';
    const tIds = getSeasonTeams(skey);
    const pills = tIds.map(tid => {
      const t = DB.teams[tid];
      if (!t) return '';
      headerTeamNames.push(t.name);
      return `<span class="team-pill" style="${teamStyle(tid)}; display:inline-flex; align-items:center; gap:6px;"><img src="${getTeamLogo(tid)}" style="height:12px;width:auto" onerror="this.style.display='none'">${t.name}</span>`;
    }).filter(Boolean).join('<span style="color:var(--text-muted);font-size:12px">→</span>');
    headerTeamBadges.push(`<span style="display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap"><span class="series-tag ${sClass}">${sLabel}</span>${pills}</span>`);
  });

  document.getElementById('hero-sub').textContent = headerTeamNames.length ? `${headerTeamNames.join(' / ')} · Active since ${firstYear}` : '';

  const latestYear = f1Seasons[0] || seasons[0];
  const latestSeasonData = driver.seasons?.[latestYear];
  const displayCarNumber = (typeof latestSeasonData === 'object' && latestSeasonData.number) ? latestSeasonData.number : (driver.number || '');
  let html = '';

  // Driver header
  html += `<div class="driver-header">
    <div class="driver-avatar-lg">
      <div class="avatar-image-wrapper">
        ${driver.flag_emoji}
      </div>
      ${displayCarNumber ? `<div class="avatar-number">#${displayCarNumber}</div>` : ''}
    </div>
    <div class="driver-header-info">
      <h2>${driver.name}</h2>
      <div class="driver-header-meta">
        <span>${driver.flag_emoji}</span>
        ${headerTeamBadges.join('<span style="color:var(--text-muted)">·</span>')}
        <span style="color:var(--text-muted)">Active ${activeRange}</span>
      </div>
      ${driver.bio ? `<p style="margin-top:10px;font-size:14px;color:var(--text-secondary);max-width:540px;line-height:1.6">${driver.bio}</p>` : ''}
    </div>
  </div>`;

  // Career stats (live)
  html += `<div class="section-header mb-1"><span class="section-title">F1CC Career Statistics <span style="font-size:10px;color:var(--blue-accent);letter-spacing:0;text-transform:none;font-weight:400">(live · updates with each race)</span></span></div>
  <div class="career-grid">
    <div class="stat-card"><div class="s-label">Races</div><div class="s-val">${careerRaces}</div></div>
    <div class="stat-card"><div class="s-label">Wins</div><div class="s-val" style="color:var(--gold)">${careerWins}</div></div>
    <div class="stat-card"><div class="s-label">Podiums</div><div class="s-val">${careerPodiums}</div></div>
    <div class="stat-card"><div class="s-label">Points</div><div class="s-val" style="color:var(--blue-accent)">${careerPoints}</div></div>
    <div class="stat-card"><div class="s-label">Poles</div><div class="s-val">${careerPoles}</div></div>
    <div class="stat-card"><div class="s-label">Fastest Laps</div><div class="s-val">${careerFL}</div></div>
    <div class="stat-card"><div class="s-label">Best Result</div><div class="s-val">${careerBestResult < 99 ? 'P'+careerBestResult : '—'}</div></div>
    <div class="stat-card"><div class="s-label">Seasons</div><div class="s-val">${seasons.length}</div></div>
  </div>`;

  // ── ELO section ────────────────────────────────────────────────────────────
  if (eloData) {
    const eloF1 = (eloData.f1?.rankings || []).find(r => r.driver === driverId);
    const eloF2 = (eloData.f2?.rankings || []).find(r => r.driver === driverId);
    const pools = [eloF1 && { pool: 'f1', data: eloF1 }, eloF2 && { pool: 'f2', data: eloF2 }].filter(Boolean);

    if (pools.length > 0) {
      html += `<div class="driver-elo-section">
        <div class="section-header mb-1" style="display:flex;align-items:center;justify-content:space-between">
          <span class="section-title">ELO Rating <span style="font-size:10px;color:var(--blue-accent);letter-spacing:0;text-transform:none;font-weight:400">(live)</span></span>
          <a href="elo.html" class="btn btn-ghost btn-sm">Full Rankings →</a>
        </div>
        <div class="driver-elo-cards">`;

      pools.forEach(({ pool, data }) => {
        const eloLabel  = pool === 'f1' ? 'F1' : 'F2';
        const rankLabel = data.pos ? `#${data.pos}` : '—';
        const hist      = data.history || [];
        const sparkIds  = `sparkline-${pool}-${Date.now()}`;
        const last      = hist.length ? hist[hist.length - 1] : null;
        const delta     = last ? last.delta : null;
        const deltaCls  = delta == null ? '' : delta > 0 ? 'col-green' : delta < 0 ? 'col-red' : '';
        const deltaStr  = delta != null ? (delta > 0 ? '+' : '') + delta.toFixed(2) : '';

        html += `<div class="driver-elo-card">
          <div class="elo-pool-row">
            <span class="elo-pool-badge ${pool}">${eloLabel}</span>
            <span class="elo-pool-rank">Rank ${rankLabel}</span>
            ${deltaStr ? `<span style="font-family:var(--font-mono);font-size:11px;margin-left:auto" class="${deltaCls}">${deltaStr} last race</span>` : ''}
          </div>
          <div class="elo-stat-row">
            <div class="elo-stat-item">
              <span class="elo-stat-label">Current ELO</span>
              <span class="elo-stat-num ${pool}">${data.current_elo.toFixed(1)}</span>
            </div>
            <div class="elo-stat-item">
              <span class="elo-stat-label">Peak ELO</span>
              <span class="elo-stat-num peak">${data.peak_elo ? data.peak_elo.toFixed(1) : '—'}</span>
            </div>
            <div class="elo-stat-item">
              <span class="elo-stat-label">Races Rated</span>
              <span class="elo-stat-num">${data.total_races}</span>
            </div>
          </div>
          ${hist.length > 1 ? `<div class="elo-sparkline-wrap"><canvas id="${sparkIds}"></canvas></div>` : ''}
        </div>`;

        // Queue sparkline render
        if (hist.length > 1) {
          setTimeout(() => {
            const ctx = document.getElementById(sparkIds)?.getContext('2d');
            if (!ctx) return;
            const labels = hist.map(h => h.race);
            const vals   = hist.map(h => h.elo_after);
            const color  = pool === 'f1' ? '#3b8de0' : '#f5a623';
            new Chart(ctx, {
              type: 'line',
              data: {
                labels,
                datasets: [{
                  data: vals,
                  borderColor: color,
                  backgroundColor: color + '18',
                  borderWidth: 1.5,
                  pointRadius: 0,
                  tension: 0.3,
                  fill: true,
                }],
              },
              options: {
                responsive: true, maintainAspectRatio: false, animation: false,
                scales: {
                  x: { display: false },
                  y: { display: false },
                },
                plugins: {
                  legend: { display: false },
                  tooltip: {
                    backgroundColor: '#1a2030', borderColor: '#2d3748', borderWidth: 1,
                    titleFont: { size: 10 }, bodyFont: { family: 'monospace', size: 10 },
                    callbacks: {
                      title: items => items[0].label,
                      label: item  => ` ELO: ${item.parsed.y.toFixed(1)}`,
                    },
                  },
                },
              },
            });
          }, 0);
        }
      });

      html += `</div></div>`;
    }
  }
  html += `<hr class="divider">`;

  // Season-by-season history
  html += `<div class="section-header mb-1"><span class="section-title">Season History</span></div>
  <div class="season-history">`;

  seasons.forEach(yearKey => {
    const dSeason = driver.seasons[yearKey];
    const champData = seasonResults[yearKey];

    // YENİ: Yılı ve Seriyi Ayrıştır
    // "2026_f2" -> year: "2026", series: "f2"
    // "2025" -> year: "2025", series: "f1"
    const displayYear = yearKey.split('_')[0];
    const seriesSuffix = yearKey.includes('_') ? yearKey.split('_')[1] : 'f1';

    const teamIds = getSeasonTeams(yearKey);
    const teamsHtml = teamIds.map(tid => {
      const team = DB.teams[tid];
      if (!team) return '';
      return `<span class="team-pill" style="${teamStyle(tid)}; display: inline-flex; align-items: center; gap: 6px;">
        <img src="${getTeamLogo(tid)}" alt="${team.short}" style="height: 12px; width: auto;" onerror="this.style.display='none'">
        ${team.name}
      </span>`;
    }).filter(Boolean).join('<span style="color:var(--text-muted);font-size:12px;margin:0 2px">→</span>');

    // Seri etiket stilleri
    const seriesTag = seriesSuffix === 'f2' ?
            `<span class="series-tag tag-f2" style="margin-left:8px; font-size:10px; vertical-align:middle;">F2</span>` :
            `<span class="series-tag tag-f1" style="margin-left:8px; font-size:10px; vertical-align:middle;">F1</span>`;

    const champPos = champData?.champPos;
    const champPosLabel = champPos === 1 ? '🏆 Champion' : champPos ? `P${champPos}` : '—';
    const champColor = champPos === 1 ? 'var(--gold)' : champPos <= 3 ? 'var(--silver)' : 'var(--text-primary)';

    // Academy pill (shown for F2 seasons only)
    let academyHtml = '';
    if (seriesSuffix === 'f2' && driver.academy) {
      const acTeam = DB.teams[driver.academy];
      if (acTeam) {
        const h = acTeam.color || '#888';
        const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
        academyHtml = `<span class="academy-pill" style="background:rgba(${r},${g},${b},0.16);color:${h};border:1px solid rgba(${r},${g},${b},0.35)">
          <img src="${getTeamLogo(driver.academy)}" alt="${acTeam.short}" style="height:10px;width:auto" onerror="this.style.display='none'">
          ${acTeam.short} Academy
        </span>`;
      }
    }

    html += `<div class="season-row">
      <div class="season-year">
        ${displayYear}
        ${seriesTag}
      </div>
      <div class="season-row-info">
        <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
          ${teamsHtml}
          ${academyHtml}
        </div>
        <div style="margin-top:6px;font-size:12px;color:var(--text-secondary)">
          #${dSeason?.number || driver.number || '—'} ·
          ${champData ? `${champData.races} races · ${champData.wins}W · ${champData.podiums}P · ${champData.points}pts` : 'Data pending'}
        </div>
      </div>
      <div class="season-champ-pos" style="color:${champColor}">${champPosLabel}</div>
      <a href="season.html?year=${yearKey}" class="btn btn-ghost btn-sm" style="margin-left:8px">Season →</a>
    </div>`;
  });

  html += `</div>`;

  document.getElementById('content').innerHTML = html;
  initTabs();
}
init().then(() => {
  if (window.twemoji) twemoji.parse(document.body, {folder:'svg', ext:'.svg'});
});
</script>
</body>
</html>
