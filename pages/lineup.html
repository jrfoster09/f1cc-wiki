    /* ── BROADCAST DRIVER LINE-UP POSTER STYLES ── */
    :root {
      --stage-bg: #0d0f13;
      --stripe-dark: #12151b;
      --poster-border: #e10600;
    }

    body.f2-theme {
      --poster-border: #0072ce;
    }

    .lineup-hero-compact {
      text-align: center;
      padding: 1.5rem 1rem 0.5rem;
    }

    .series-switcher {
      display: inline-flex;
      background: var(--navy-mid, #1a1e28);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 3px;
      gap: 4px;
      margin-bottom: 1.2rem;
    }
    .series-switch-btn {
      padding: 7px 18px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--text-secondary, #9aa0a6);
      font-size: 13px;
      font-weight: 700;
      font-family: 'Chakra Petch', var(--font-display), sans-serif;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .series-switch-btn:hover {
      color: #fff;
    }
    .series-switch-btn.active {
      background: var(--red, #e10600);
      color: #fff;
      box-shadow: 0 2px 10px rgba(225, 6, 0, 0.4);
    }
    .f2-theme .series-switch-btn.active {
      background: #0072ce;
      box-shadow: 0 2px 10px rgba(0, 114, 206, 0.4);
    }

    /* ── POSTER CONTAINER ── */
    .broadcast-poster {
      max-width: 1440px;
      margin: 0 auto 3rem;
      position: relative;
      background-color: var(--stage-bg);
      background-image: 
        repeating-linear-gradient(
          -34deg,
          rgba(255, 255, 255, 0.02) 0px,
          rgba(255, 255, 255, 0.02) 28px,
          rgba(0, 0, 0, 0.4) 28px,
          rgba(0, 0, 0, 0.4) 58px
        );
      border-top: 6px solid var(--poster-border);
      border-bottom: 6px solid var(--poster-border);
      box-shadow: 0 20px 50px rgba(0,0,0,0.85);
      overflow: hidden;
      padding: 3.5rem 2rem;
    }

    /* Corner Badges */
    .corner-badge {
      position: absolute;
      background: #FFFFFF;
      color: #000000;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 900;
      font-size: 12px;
      line-height: 1.15;
      letter-spacing: 0.5px;
      z-index: 10;
      user-select: none;
    }
    .corner-badge-tl {
      top: 0;
      left: 0;
      padding: 8px 45px 8px 18px;
      clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%);
      text-align: left;
    }
    .corner-badge-br {
      bottom: 0;
      right: 0;
      padding: 8px 18px 8px 45px;
      clip-path: polygon(20% 0, 100% 0, 100% 100%, 0 100%);
      text-align: right;
    }

    /* ── BROADCAST GRID (Dual column + Centerpiece) ── */
    .broadcast-grid {
      display: grid;
      grid-template-columns: 1fr 260px 1fr;
      column-gap: 24px;
      row-gap: 30px;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    @media (max-width: 1200px) {
      .broadcast-grid {
        grid-template-columns: 1fr 200px 1fr;
        column-gap: 16px;
        row-gap: 24px;
      }
    }

    @media (max-width: 980px) {
      .broadcast-grid {
        grid-template-columns: 1fr;
        row-gap: 20px;
      }
      .broadcast-centerpiece-wrapper {
        grid-row: auto !important;
        order: -1;
        margin: 1rem 0 2rem;
      }
    }

    .team-col {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* ── CENTERPIECE ── */
    .broadcast-centerpiece-wrapper {
      grid-column: 2;
      grid-row: 1 / span 5;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .broadcast-centerpiece {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      filter: drop-shadow(0 4px 20px rgba(0,0,0,0.8));
    }

    .centerpiece-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2px;
    }
    .centerpiece-logo-text {
      font-family: 'Chakra Petch', sans-serif;
      font-style: italic;
      font-weight: 900;
      font-size: 3rem;
      letter-spacing: 4px;
      color: #FFFFFF;
      text-shadow: 0 0 15px rgba(255,255,255,0.4);
      line-height: 1;
    }

    .centerpiece-title {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 900;
      font-size: 2.8rem;
      line-height: 0.95;
      letter-spacing: 2px;
      color: #FFFFFF;
      text-transform: uppercase;
    }
    .centerpiece-sub {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 900;
      font-size: 2.8rem;
      line-height: 0.95;
      letter-spacing: 2px;
      color: #FFFFFF;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* ── BROADCAST TEAM CARD ── */
    .broadcast-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .broadcast-card:hover {
      transform: translateY(-2px);
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.7));
    }

    /* Top: [Left Num]  [Team Logo]  [Right Num] */
    .card-top-row {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 16px;
      margin-bottom: 4px;
      padding: 0 10px;
    }

    .num-slot {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      position: relative;
    }
    .num-slot.left-slot {
      justify-content: flex-end;
    }
    .num-slot.right-slot {
      justify-content: flex-start;
    }

    .driver-big-num {
      font-family: 'Chakra Petch', 'Barlow Semi Condensed', sans-serif;
      font-weight: 900;
      font-size: 58px;
      line-height: 0.9;
      letter-spacing: -2px;
      transition: transform 0.15s ease, filter 0.15s ease;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.8));
    }
    .num-slot:hover .driver-big-num {
      transform: scale(1.08);
      filter: drop-shadow(0 5px 12px rgba(255,255,255,0.3));
    }

    /* Rookie Glow & Indicator */
    .num-slot.is-rookie .driver-big-num {
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.75));
    }
    .rookie-crown {
      position: absolute;
      top: -12px;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 900;
      font-size: 9px;
      letter-spacing: 1px;
      background: #FFD700;
      color: #000;
      padding: 1px 5px;
      border-radius: 2px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      pointer-events: none;
    }
    .left-slot .rookie-crown {
      right: 4px;
    }
    .right-slot .rookie-crown {
      left: 4px;
    }

    /* Center Team Logo */
    .card-team-logo-slot {
      width: 90px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      flex-shrink: 0;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .card-team-logo-slot:hover {
      transform: scale(1.12);
      filter: drop-shadow(0 4px 14px rgba(255,255,255,0.3));
    }
    .card-team-logo-img {
      max-height: 48px;
      max-width: 86px;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.7));
    }

    /* Bottom: Angled Name Bar */
    .card-name-bar {
      width: 100%;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: skewX(-24deg);
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .name-half {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: inherit;
      padding: 0 8px;
      transition: background 0.15s ease;
    }
    .name-half:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .name-half-text {
      font-family: 'Chakra Petch', var(--font-display), sans-serif;
      font-weight: 800;
      font-style: italic;
      font-size: 14.5px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transform: skewX(24deg); /* Keep text upright and readable */
    }

    .name-bar-divider {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 900;
      font-size: 18px;
      opacity: 0.85;
      padding: 0 4px;
      user-select: none;
      line-height: 1;
    }

    /* Rookie Name Highlight */
    .name-half.is-rookie .name-half-text {
      text-decoration: underline;
      text-decoration-color: #FFD700;
      text-decoration-thickness: 3px;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .broadcast-poster {
        padding: 2.8rem 0.8rem;
      }
      .driver-big-num {
        font-size: 42px;
      }
      .card-team-logo-slot {
        width: 70px;
        height: 42px;
      }
      .card-team-logo-img {
        max-height: 38px;
        max-width: 65px;
      }
      .name-half-text {
        font-size: 12px;
      }
      .centerpiece-logo-text {
        font-size: 2.2rem;
      }
      .centerpiece-title, .centerpiece-sub {
        font-size: 2rem;
      }
    }
  </style>
</head>

let CURRENT_SERIES = 'f1';

async function init() {
  if (typeof loadDB === 'function') {
    try {
      DB = await loadDB();
    } catch(e) {}
  }
  if (!DB) {
    const paths = ['../data/db.json', 'data/db.json', '/data/db.json'];
    for (const p of paths) {
      try {
        const resp = await fetch(p);
        if (resp.ok) {
          DB = await resp.json();
          break;
        }
      } catch(e) {}
    }
  }

  const params = new URLSearchParams(window.location.search);
  const path = window.location.pathname.toLowerCase();
  if (params.get('series') === 'f2' || path.includes('f2')) {
    CURRENT_SERIES = 'f2';
  } else {
    CURRENT_SERIES = 'f1';
  }

  switchSeries(CURRENT_SERIES, false);
}

function switchSeries(series, updateHistory = true) {
  CURRENT_SERIES = series;
  const isF2 = series === 'f2';

  document.getElementById('btn-series-f1').classList.toggle('active', !isF2);
  document.getElementById('btn-series-f2').classList.toggle('active', isF2);
  document.getElementById('btn-series-f1').setAttribute('aria-selected', !isF2);
  document.getElementById('btn-series-f2').setAttribute('aria-selected', isF2);

  if (isF2) {
    document.body.className = 'f2-theme';
    document.title = '2027 F2 Driver Line-Up — F1CC Wiki';
    document.getElementById('corner-tl').innerHTML = '<div>JUNIOR SERIES 27</div><div>DRIVER LINE-UP</div>';
    document.getElementById('corner-br').innerHTML = '<div>JUNIOR SERIES 27</div><div>DRIVER LINE-UP</div>';
  } else {
    document.body.className = 'f1-theme';
    document.title = '2027 Driver Line-Up — F1CC Wiki';
    document.getElementById('corner-tl').innerHTML = '<div>COMMUNITY CAREER 27</div><div>DRIVER LINE-UP</div>';
    document.getElementById('corner-br').innerHTML = '<div>COMMUNITY CAREER 27</div><div>DRIVER LINE-UP</div>';
  }

  renderBroadcastGrid(isF2);

  if (updateHistory) {
    try {
      const isCustomDomain = window.location.hostname === 'f1cc.wiki' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const basePath = isCustomDomain ? '/' : (window.location.pathname.startsWith('/f1cc-wiki') ? '/f1cc-wiki/' : '/');
      window.history.replaceState({ series }, '', basePath + 'lineup' + window.location.hash);
    } catch(e) {}
  }

  if (window.twemoji) {
    twemoji.parse(document.getElementById('broadcast-poster'), { folder: 'svg', ext: '.svg' });
  }
}

function getDriverMeta(id, isF2) {
  if (!id) return { id: '', name: 'TBD', displayName: 'TBD', number: '—', isRookie: false, isEmpty: true };
  const d = (DB && DB.drivers && DB.drivers[id]) ? DB.drivers[id] : {};
  let num = d.number != null ? d.number : '—';
  if (isF2 && id === 'md_03') num = 33;

  const displayName = DISPLAY_NAMES[id] || d.name || id;
  const isRookie = isF2 ? ROOKIES_F2.has(id) : ROOKIES_F1.has(id);

  return {
    id,
    name: d.name || id,
    displayName,
    number: num,
    isRookie,
    isEmpty: false
  };
}

function renderTeamCard(teamKey, isF2) {
  const teamsConfig = isF2 ? F2_BROADCAST_TEAMS : F1_BROADCAST_TEAMS;
  const pairings = isF2 ? F2_PAIRINGS : F1_PAIRINGS;

  const cfg = teamsConfig[teamKey] || {
    name: teamKey,
    barColor: '#333333',
    numColor: '#FFFFFF',
    textColor: '#FFFFFF',
    logo: getTeamLogo(teamKey, '../')
  };

  const [leftId, rightId] = pairings[teamKey] || [null, null];
  const leftDriver  = getDriverMeta(leftId, isF2);
  const rightDriver = getDriverMeta(rightId, isF2);

  const leftSlug  = leftDriver.name.trim().replace(/\s+/g, '_');
  const rightSlug = rightDriver.name.trim().replace(/\s+/g, '_');

  const leftHref  = leftDriver.isEmpty ? 'javascript:void(0)' : `../${leftSlug}`;
  const rightHref = rightDriver.isEmpty ? 'javascript:void(0)' : `../${rightSlug}`;

  const leftNumColor  = leftDriver.isEmpty ? 'rgba(255,255,255,0.22)' : cfg.numColor;
  const rightNumColor = rightDriver.isEmpty ? 'rgba(255,255,255,0.22)' : cfg.numColor;

  const leftRookieClass  = leftDriver.isRookie ? 'is-rookie' : '';
  const rightRookieClass = rightDriver.isRookie ? 'is-rookie' : '';

  const leftCrown  = leftDriver.isRookie ? '<span class="rookie-crown">ROOKIE</span>' : '';
  const rightCrown = rightDriver.isRookie ? '<span class="rookie-crown">ROOKIE</span>' : '';

  const leftTextExtra  = leftDriver.isEmpty ? 'opacity:0.45; font-style:normal;' : '';
  const rightTextExtra = rightDriver.isEmpty ? 'opacity:0.45; font-style:normal;' : '';

  return `
    <div class="broadcast-card" id="card-${teamKey}">
      <!-- Numbers & Center Logo Row -->
      <div class="card-top-row">
        <a href="${leftHref}" class="num-slot left-slot ${leftRookieClass}" style="${leftDriver.isEmpty ? 'pointer-events:none;' : ''}" title="${leftDriver.name}${leftDriver.isRookie ? ' (Rookie)' : ''}">
          <span class="driver-big-num" style="color: ${leftNumColor};">${leftDriver.number}</span>
          ${leftCrown}
        </a>

        <a href="../${teamKey}" class="card-team-logo-slot" title="${cfg.name}">
          <img src="${cfg.logo}" alt="${cfg.name}" class="card-team-logo-img" onerror="this.style.display='none'">
        </a>

        <a href="${rightHref}" class="num-slot right-slot ${rightRookieClass}" style="${rightDriver.isEmpty ? 'pointer-events:none;' : ''}" title="${rightDriver.name}${rightDriver.isRookie ? ' (Rookie)' : ''}">
          <span class="driver-big-num" style="color: ${rightNumColor};">${rightDriver.number}</span>
          ${rightCrown}
        </a>
      </div>

      <!-- Angled Name Bar -->
      <div class="card-name-bar" style="background-color: ${cfg.barColor}; color: ${cfg.textColor};">
        <a href="${leftHref}" class="name-half ${leftRookieClass}" style="${leftDriver.isEmpty ? 'pointer-events:none;' : ''}" title="${leftDriver.name}">
          <span class="name-half-text" style="${leftTextExtra}">${leftDriver.displayName}</span>
        </a>
        <div class="name-bar-divider">/</div>
        <a href="${rightHref}" class="name-half ${rightRookieClass}" style="${rightDriver.isEmpty ? 'pointer-events:none;' : ''}" title="${rightDriver.name}">
          <span class="name-half-text" style="${rightTextExtra}">${rightDriver.displayName}</span>
        </a>
      </div>
    </div>
  `;
}

function renderBroadcastGrid(isF2) {
  const grid = document.getElementById('broadcast-grid');
  const layout = isF2 ? F2_LAYOUT : F1_LAYOUT;

  let leftHtml = '';
  layout.left.forEach(t => {
    leftHtml += renderTeamCard(t, isF2);
  });

  let rightHtml = '';
  layout.right.forEach(t => {
    rightHtml += renderTeamCard(t, isF2);
  });

  const centerLogoText = isF2 ? 'F2CC' : 'F1CC';

  const centerpieceHtml = `
    <div class="broadcast-centerpiece-wrapper">
      <div class="broadcast-centerpiece">
        <div class="centerpiece-logo">
          <span class="centerpiece-logo-text">${centerLogoText}</span>
        </div>
        <div class="centerpiece-title">DRIVER</div>
        <div class="centerpiece-sub">LINE-UP</div>
      </div>
    </div>
  `;

  grid.innerHTML = `
    <div class="team-col left-col">
      ${leftHtml}
    </div>
    ${centerpieceHtml}
    <div class="team-col right-col">
      ${rightHtml}
    </div>
  `;
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>

</body>
</html>
